<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Syntax Protocol</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: monospace; color: #fff; }
    #wrapper { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 20%, #0f172a 0%, #030712 100%); }
    canvas { display: block; background: #020617; border: 1px solid rgba(56, 189, 248, 0.3); max-width: 100%; max-height: 100%; }
    
    /* Touch controls for mobile / APK */
    #touch-panel {
      position: absolute; bottom: 20px; left: 0; width: 100%;
      display: flex; justify-content: space-between; padding: 0 24px;
      pointer-events: none; z-index: 10;
    }
    .t-grp { display: flex; gap: 12px; pointer-events: auto; }
    .btn {
      width: 68px; height: 68px; border-radius: 14px;
      background: rgba(15, 23, 42, 0.85); border: 1.5px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8; font-size: 24px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .btn.fire { width: 100px; background: rgba(2, 132, 199, 0.3); border-color: #38bdf8; color: #fff; font-size: 15px; letter-spacing: 1px; }
    .btn:active { background: rgba(56, 189, 248, 0.5); transform: scale(0.94); }

    /* UI Overlay */
    #start-screen {
      position: absolute; inset: 0; background: rgba(3, 7, 18, 0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center; z-index: 20;
    }
    #start-screen h1 { font-size: 26px; color: #38bdf8; margin-bottom: 12px; letter-spacing: 1px; }
    #start-screen p { color: #94a3b8; font-size: 13px; max-width: 320px; line-height: 1.5; margin-bottom: 24px; }
    #play-btn {
      background: #0284c7; color: #fff; border: none; font-size: 14px;
      font-weight: bold; padding: 14px 28px; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <canvas id="view" width="480" height="720"></canvas>
    
    <div id="start-screen">
      <h1>SYNTAX PROTOCOL</h1>
      <p>Mobile Cyber Defense Node<br>Defend against packet leaks and malicious bots.</p>
      <button id="play-btn" type="button">START MISSION</button>
    </div>

    <div id="touch-panel">
      <div class="t-grp">
        <button id="lBtn" class="btn" type="button">◀</button>
        <button id="rBtn" class="btn" type="button">▶</button>
      </div>
      <div class="t-grp">
        <button id="fBtn" class="btn fire" type="button">DEFEND</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");
    const startScreen = document.getElementById("start-screen");
    const playBtn = document.getElementById("play-btn");

    function fit() {
      const scale = Math.min(window.innerWidth / 480, window.innerHeight / 720);
      canvas.style.width = (480 * scale) + "px";
      canvas.style.height = (720 * scale) + "px";
    }
    window.addEventListener("resize", fit);
    fit();

    let active = false;
    let score = 0;
    let health = 100;
    let frame = 0;

    const ship = { x: 240, y: 640, w: 32, h: 28, speed: 6, vx: 0 };
    let bullets = [];
    let targets = [];
    const keys = { l: false, r: false };

    function bind(id, start, stop) {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); start(); }, { passive: false });
      el.addEventListener("touchend", (e) => { e.preventDefault(); stop(); }, { passive: false });
      el.addEventListener("mousedown", start);
      el.addEventListener("mouseup", stop);
    }
    bind("lBtn", () => keys.l = true, () => keys.l = false);
    bind("rBtn", () => keys.r = true, () => keys.r = false);
    bind("fBtn", () => shoot(), () => {});

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.l = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.r = true;
      if (e.code === "Space") shoot();
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.l = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.r = false;
    });

    function shoot() {
      if (!active) return;
      bullets.push({ x: ship.x, y: ship.y - 12 });
      if (navigator.vibrate) navigator.vibrate(15);
    }

    playBtn.addEventListener("click", () => {
      score = 0; health = 100; bullets = []; targets = [];
      ship.x = 240; active = true;
      startScreen.style.display = "none";
    });

    function tick() {
      if (active) {
        frame++;
        if (keys.l) ship.vx = -ship.speed;
        else if (keys.r) ship.vx = ship.speed;
        else ship.vx *= 0.7;

        ship.x += ship.vx;
        if (ship.x < 24) ship.x = 24;
        if (ship.x > 456) ship.x = 456;

        if (frame % 45 === 0) {
          targets.push({
            x: Math.random() * 400 + 40,
            y: -20,
            speed: Math.random() * 2 + 2,
            type: Math.random() > 0.5 ? "LEAK" : "BUG"
          });
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          bullets[i].y -= 10;
          if (bullets[i].y < -10) bullets.splice(i, 1);
        }

        for (let i = targets.length - 1; i >= 0; i--) {
          const t = targets[i];
          t.y += t.speed;

          for (let b = bullets.length - 1; b >= 0; b--) {
            if (Math.hypot(bullets[b].x - t.x, bullets[b].y - t.y) < 20) {
              bullets.splice(b, 1);
              targets.splice(i, 1);
              score += 100;
              break;
            }
          }

          if (t && t.y > 670) {
            targets.splice(i, 1);
            health -= 10;
            if (health <= 0) {
              active = false;
              startScreen.style.display = "flex";
              startScreen.querySelector("h1").textContent = "NODE COMPROMISED";
              startScreen.querySelector("p").innerHTML = `Score: ${score}<br>Architecture shielded.`;
              playBtn.textContent = "REBOOT SYSTEM";
            }
          }
        }
      }

      // Draw
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, 480, 720);

      // HUD
      ctx.fillStyle = "#38bdf8";
      ctx.font = "14px monospace";
      ctx.fillText(`SCORE: ${score}`, 20, 32);
      ctx.fillText(`FIREWALL: ${health}%`, 320, 32);

      // Player
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.moveTo(ship.x, ship.y - 14);
      ctx.lineTo(ship.x - 16, ship.y + 14);
      ctx.lineTo(ship.x + 16, ship.y + 14);
      ctx.closePath();
      ctx.fill();

      // Bullets
      ctx.fillStyle = "#34d399";
      for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 12);

      // Enemies
      for (const t of targets) {
        ctx.fillStyle = t.type === "BUG" ? "#f59e0b" : "#ef4444";
        ctx.fillRect(t.x - 14, t.y - 12, 28, 24);
        ctx.fillStyle = "#020617";
        ctx.font = "bold 9px monospace";
        ctx.textAlign = "center";
        ctx.fillText(t.type, t.x, t.y + 4);
        ctx.textAlign = "start";
      }

      requestAnimationFrame(tick);
    }
    tick();
  </script>
</body>
</html>
