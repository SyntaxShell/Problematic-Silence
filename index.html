<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Problematic Silence</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <div id="game-stage">
        <canvas id="game" aria-label="Problematic Silence"></canvas>
        
        <div class="shell-watermark" aria-hidden="true">
          <img src="watermark.jpeg" alt="" />
        </div>

        <!-- Mobile Touch Controls Overlay -->
        <div id="touch-controls" class="touch-layer" aria-hidden="true">
          <div class="d-pad">
            <button id="btn-left" class="ctrl-btn" type="button" aria-label="Left">◀</button>
            <button id="btn-right" class="ctrl-btn" type="button" aria-label="Right">▶</button>
          </div>
          <div class="action-pad">
            <button id="btn-interact" class="ctrl-btn action" type="button" aria-label="Interact">YAAR</button>
            <button id="btn-jump" class="ctrl-btn jump" type="button" aria-label="Jump">▲</button>
          </div>
        </div>
      </div>

      <section class="hud gameplay-ui" aria-label="Game status" aria-hidden="true">
        <div class="hud-brand">
          <div class="hud-brand-copy">
            <div class="hud-brand-mark">
              <img src="watermark.jpeg" alt="SyntaxShell wolf crest" />
            </div>
            <p class="eyebrow">SyntaxShell Company</p>
            <h1>Problematic Silence</h1>
          </div>
          <p class="founder-mark">Founded by Rudra</p>
        </div>
        <div class="hud-panels">
          <div class="panel">
            <span>Score</span>
            <strong id="scoreValue">000000</strong>
          </div>
          <div class="panel">
            <span>High Score</span>
            <strong id="highScoreValue">000000</strong>
          </div>
          <div class="panel compact">
            <span>Relics</span>
            <strong id="relicsValue">0/3</strong>
          </div>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
